name: Strat Algo Alerts

on:
  schedule:
    # Every 15 minutes during US market hours, Mon-Fri (13:00-20:59 UTC
    # covers 9:30-16:00 ET during daylight saving). The universe is US
    # stocks/ETFs only, so no overnight or weekend runs are needed.
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      test_ping:
        description: 'Send one test alert to verify push + email delivery (skips the scan)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: strat-algo-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: strat-scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strat-scanner/package-lock.json

      # Previous sweep's alert keys — used to alert only on NEW confirmed triggers.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: strat-scanner/server/.state
          key: strat-algo-state-${{ github.run_id }}
          restore-keys: |
            strat-algo-state-

      - name: Install dependencies
        run: npm ci

      - name: Scan and alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TEST_PING: ${{ inputs.test_ping }}
          ALGO_MIN_CONFIDENCE: ${{ vars.ALGO_MIN_CONFIDENCE || '60' }}
          ALGO_TIMEFRAMES: ${{ vars.ALGO_TIMEFRAMES || 'D,W,M' }}

        run: npm run algo-alert

  


      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: strat-scanner/server/.state
          key: strat-algo-state-${{ github.run_id }}
