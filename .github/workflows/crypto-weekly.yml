name: Crypto Weekly Report

on:
  schedule:
    # Mondays 01:00 UTC — an hour after the weekly crypto candle closes, so the
    # week that just ended is a completed bar and its high/low are the levels
    # the report plans around. (Sunday 9pm ET / 8pm CT.)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the report to the run log instead of sending it'
        type: boolean
        default: false
      test_ping:
        description: 'Send one test notification to verify delivery (skips the scan)'
        type: boolean
        default: false

# The weekly run seeds the tracked ladder, which is committed.
permissions:
  contents: write

# Shares a group with Ladder Fills: both write the position record.
concurrency:
  group: ladder-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: strat-scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strat-scanner/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The weekly report is stateless: it always publishes the current picture,
      # so there is no dedupe cache to restore or save.
      - name: Build and send the weekly crypto report
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Optional: Alpaca crypto bars are free, and the client works without
          # credentials. Set both secrets if Alpaca ever requires auth.
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          # Set to 'yahoo' to pin crypto back to the old source without a deploy.
          CRYPTO_PROVIDER: ${{ vars.CRYPTO_PROVIDER }}
          WEEKLY_NTFY_ASSETS: ${{ vars.WEEKLY_NTFY_ASSETS || '4' }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_PING: ${{ inputs.test_ping }}
        run: npm run weekly-crypto

      - name: Commit the position record
        if: ${{ !inputs.dry_run && !inputs.test_ping }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # --porcelain, not diff: the record is untracked on its first write,
          # and git diff does not report untracked files.
          if [ -z "$(git status --porcelain -- strat-scanner/data/ladder-state.json)" ]; then
            echo "No ladder state change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strat-scanner/data/ladder-state.json
          git commit -m "Update ladder plan record"
          # The branch may have moved while the scan ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
