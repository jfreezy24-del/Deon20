name: Ladder Fills

on:
  schedule:
    # Daily at 00:20 UTC, after the crypto daily candle closes, so the bar
    # being checked is complete.
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print fills to the log, send nothing and save no state'
        type: boolean
        default: false

# The position record is committed, so this job needs write access.
permissions:
  contents: write

concurrency:
  group: ladder-state
  cancel-in-progress: false

jobs:
  fills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: strat-scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strat-scanner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check ladder fills
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          CRYPTO_PROVIDER: ${{ vars.CRYPTO_PROVIDER }}
          # Numeric role id to @mention. Not a secret; a repo variable.
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          # The coins Discord reports on. Same variable the weekly write-ups
          # read, so the two lists cannot drift apart.
          WRITEUP_SYMBOL: ${{ vars.WRITEUP_SYMBOL }}
          RUNG_TTL_DAYS: ${{ vars.RUNG_TTL_DAYS || '90' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run ladder-fills

      # Every fill lands in git history, so the position record is auditable.
      - name: Commit the position record
        if: ${{ !inputs.dry_run }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # --porcelain, not diff: the record is untracked on its first write,
          # and git diff does not report untracked files.
          if [ -z "$(git status --porcelain -- strat-scanner/data/ladder-state.json)" ]; then
            echo "No ladder state change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strat-scanner/data/ladder-state.json
          git commit -m "Update ladder position record"
          # The branch may have moved while the scan ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
