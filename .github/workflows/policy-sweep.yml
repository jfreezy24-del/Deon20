name: Policy Sweep

on:
  schedule:
    # Quarterly, on the 3rd at 03:00 UTC — the day after the calibration run,
    # so the two long replays never contend for the same data source or for a
    # push to the same branch.
    - cron: '0 3 3 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of daily history to replay'
        type: string
        default: '10'
      symbols:
        description: 'Comma-separated symbols (blank = the full universe)'
        type: string
        default: ''
      is_fraction:
        description: 'Share of dates used to choose the winner in-sample'
        type: string
        default: '0.7'
      dry_run:
        description: 'Print the report and write nothing'
        type: boolean
        default: false

# The sweep report is committed so policy changes are diffable.
permissions:
  contents: write

concurrency:
  group: policy-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # A decade of daily bars for the whole universe, fetched sequentially.
    # Resolution itself is fast — detection runs once and only the exits repeat.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: strat-scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strat-scanner/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No NTFY_TOPIC and no webhook of any kind: this job sends nothing. A
      # sweep is a report to read carefully and argue with; the moment it
      # becomes a notification it becomes a thing you skim and act on.
      - name: Sweep policies and validate walk-forward
        env:
          SWEEP_YEARS: ${{ inputs.years || '10' }}
          SWEEP_SYMBOLS: ${{ inputs.symbols }}
          SWEEP_TIMEFRAMES: ${{ vars.SWEEP_TIMEFRAMES || 'D,W,M' }}
          SWEEP_MIN_CONFIDENCE: ${{ vars.SWEEP_MIN_CONFIDENCE || '50' }}
          SWEEP_IS_FRACTION: ${{ inputs.is_fraction || '0.7' }}
          REGIME_BENCHMARK: ${{ vars.REGIME_BENCHMARK || 'SPY' }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          CRYPTO_PROVIDER: ${{ vars.CRYPTO_PROVIDER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run sweep

      - name: Publish the report to the run summary
        if: ${{ !inputs.dry_run }}
        run: cat data/policy-sweep.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the sweep report
        if: ${{ !inputs.dry_run }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$(git status --porcelain -- strat-scanner/data/policy-sweep.md)" ]; then
            echo "No sweep change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strat-scanner/data/policy-sweep.md
          git commit -m "Update policy sweep report"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
