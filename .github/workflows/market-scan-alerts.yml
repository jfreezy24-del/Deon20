name: Market Scan Alerts

on:
  schedule:
    # Every 15 minutes during US market hours, Mon-Fri (13:00-20:59 UTC
    # covers 9:30-16:00 ET during daylight saving).
    - cron: '*/15 13-20 * * 1-5'
    # Hourly outside market hours for 24/7 markets (crypto, FX): overnight
    # on weekdays plus all weekend. Trim these lines to save Actions minutes
    # if the repo ever goes private.
    - cron: '0 0-12,21-23 * * 1-5'
    - cron: '0 * * * 0,6'
  workflow_dispatch:
    inputs:
      test_ping:
        description: 'Send one test notification to verify ntfy delivery (skips the scan)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: strat-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: strat-scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strat-scanner/package-lock.json

      # Previous sweep's signal keys — used to alert only on NEW signals.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: strat-scanner/server/.state
          key: strat-alert-state-${{ github.run_id }}
          restore-keys: |
            strat-alert-state-

      - name: Install dependencies
        run: npm ci

      - name: Scan and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PING: ${{ inputs.test_ping }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE || '50' }}
          NOTIFY_SETUPS: ${{ vars.NOTIFY_SETUPS || 'true' }}
          SETUP_MIN_CONFIDENCE: ${{ vars.SETUP_MIN_CONFIDENCE || '65' }}
        run: npm run alert

      - name: Send Discord alert
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "Your alert message"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"


      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: strat-scanner/server/.state
          key: strat-alert-state-${{ github.run_id }}
