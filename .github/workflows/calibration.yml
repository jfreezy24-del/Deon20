name: Confidence Calibration

on:
  schedule:
    # Quarterly, on the 2nd at 03:00 UTC. The model does not move often and
    # the run is long; more frequently would burn Actions minutes to re-derive
    # numbers that have barely changed.
    - cron: '0 3 2 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of daily history to replay'
        type: string
        default: '10'
      symbols:
        description: 'Comma-separated symbols (blank = the full universe)'
        type: string
        default: ''
      dry_run:
        description: 'Print the report and write nothing'
        type: boolean
        default: false

# The calibration report is committed so model changes are diffable.
permissions:
  contents: write

concurrency:
  group: calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    # A decade of daily bars for the whole universe, fetched sequentially.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: strat-scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strat-scanner/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No NTFY_TOPIC and no webhook of any kind: this job sends nothing. It is
      # a report to read deliberately, not a notification.
      - name: Replay and calibrate
        env:
          CALIBRATION_YEARS: ${{ inputs.years || '10' }}
          CALIBRATION_SYMBOLS: ${{ inputs.symbols }}
          CALIBRATION_TIMEFRAMES: ${{ vars.CALIBRATION_TIMEFRAMES || 'D,W,M' }}
          ENTRY_WINDOW_BARS: ${{ vars.ENTRY_WINDOW_BARS || '1' }}
          MAX_HOLD_BARS: ${{ vars.MAX_HOLD_BARS || '6' }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          CRYPTO_PROVIDER: ${{ vars.CRYPTO_PROVIDER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run calibrate

      - name: Publish the report to the run summary
        if: ${{ !inputs.dry_run }}
        run: cat data/calibration.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the calibration report
        if: ${{ !inputs.dry_run }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$(git status --porcelain -- strat-scanner/data/calibration.md)" ]; then
            echo "No calibration change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strat-scanner/data/calibration.md
          git commit -m "Update confidence calibration report"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
