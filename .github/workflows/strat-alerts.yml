name: Strat Alerts

on:
  schedule:
    # Every 15 minutes during US market hours, Mon-Fri (13:00-20:59 UTC
    # covers 9:30-16:00 ET during daylight saving). Add more cron lines for
    # crypto/overnight coverage, but mind your GitHub Actions minutes on
    # private repos.
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strat-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: strat-scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strat-scanner/package-lock.json

      # Previous sweep's signal keys — used to alert only on NEW signals.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: strat-scanner/server/.state
          key: strat-alert-state-${{ github.run_id }}
          restore-keys: |
            strat-alert-state-

      - name: Install dependencies
        run: npm ci

      - name: Scan and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE || '50' }}
          NOTIFY_SETUPS: ${{ vars.NOTIFY_SETUPS || 'true' }}
          SETUP_MIN_CONFIDENCE: ${{ vars.SETUP_MIN_CONFIDENCE || '65' }}
        run: npm run alert

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: strat-scanner/server/.state
          key: strat-alert-state-${{ github.run_id }}
